<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #060d1a; color: #e2e8f0; font-family: sans-serif;

#controls { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; flex-shrink: 0; }
#row1 { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
#row2 { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
#row3 { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
#chart-area { flex: 1; min-height: 0; position: relative; }
canvas { display: block; }
#tooltip { position: fixed; display: none; pointer-events: none; z-index: 200;
  background: #0f172a; border: 2px solid #ff2d55; border-radius: 10px;
  padding: 10px 14px; font-size: 12px; color: #f1f5f9; min-width: 160px;
  box-shadow: 0 4px 20px #ff2d5544; }
#info { text-align: center; font-size: 10px; color: #475569; }
button.fbtn { padding: 3px 10px; border-radius: 16px; border: none; cursor: pointer;
  font-size: 10px; font-weight: 700; transition: all 0.15s; }
button.tbtn { padding: 3px 14px; border-radius: 16px; border: none; cursor: pointer;
  font-size: 10px; font-weight: 700; transition: all 0.15s; }
button.rbtn { padding: 3px 11px; border-radius: 16px; border: none; cursor: pointer;
  font-size: 10px; font-weight: 700; transition: all 0.15s; }
#legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #94a3b8; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>

  <div id="row3">

<div id="chart-area">

<div id="tooltip"></div>

        </select>
        <button onclick="toggleGrowthTable()"

    </div>
    <!-- Table body -->

    <!-- Footer note -->

</div>

function xVal(area) {
  if (scaleMode === 'growth') return Math.log10(Math.max(area, 0.001));
  const v = scaleMode === 'japan' ? area / JAPAN_AREA : area;
  return Math.log10(Math.max(v, 1e-9));
}
function xMin() { return scaleMode === 'japan' ? X_MIN_JP : X_MIN_KM; }
function xMax() { return scaleMode === 'japan' ? X_MAX_JP : X_MAX_KM; }

// ---- 描画 ----
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let PAD = { left:68, right:20, top:20, bottom:52 };

function resize() {
  const area = document.getElementById('chart-area');
  canvas.width  = area.clientWidth;
  canvas.height = area.clientHeight;
  draw();
}

function toPixel(lx, ly) {
  const W = canvas.width  - PAD.left - PAD.right;
  const H = canvas.height - PAD.top  - PAD.bottom;
  const px = PAD.left + (lx - xMin()) / (xMax() - xMin()) * W;
  const py = canvas.height - PAD.bottom - (ly - Y_MIN) / (Y_MAX - Y_MIN) * H;
  return [px, py];
}

function drawAxes() {
  const W = canvas.width  - PAD.left - PAD.right;
  const H = canvas.height - PAD.top  - PAD.bottom;
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;

  // X軸グリッド・目盛り
  const xSteps = Math.round(xMax()) - Math.round(xMin());
  for (let i = 0; i <= xSteps; i++) {
    const lx = Math.round(xMin()) + i;
    if (lx < xMin() || lx > xMax()) continue;
    const [px] = toPixel(lx, Y_MIN);
    ctx.beginPath(); ctx.moveTo(px, PAD.top); ctx.lineTo(px, canvas.height - PAD.bottom); ctx.stroke();
    // ラベル
    ctx.fillStyle = '#475569'; ctx.font = '9px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const r = Math.pow(10, lx);
    let label;
    if (scaleMode === 'japan') {
      if (r >= 10)      label = r.toFixed(0)+'×';
      else if (r >= 1)  label = r.toFixed(1)+'×';
      else {
        const pct = r*100;
        if (pct >= 1)        label = pct.toFixed(0)+'%';
        else if (pct >= 0.01) label = pct.toFixed(2)+'%';
        else                  label = pct.toFixed(4)+'%';
      }
    } else {
      label = r>=1e6?(r/1e6).toFixed(0)+'M':r>=1000?(r/1000).toFixed(0)+'k':r.toFixed(0);
    }
    ctx.fillText(label, px, canvas.height - PAD.bottom + 4);
  }

  // Y軸グリッド・目盛り
  for (let ly = Math.ceil(Y_MIN); ly <= Math.floor(Y_MAX); ly++) {
    const [, py] = toPixel(xMin(), ly);
    ctx.beginPath(); ctx.moveTo(PAD.left, py); ctx.lineTo(canvas.width - PAD.right, py); ctx.stroke();
    ctx.fillStyle = '#475569'; ctx.font = '9px sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const pop = Math.pow(10, ly);
    const label = pop>=1e6?(pop/1e6).toFixed(0)+'億':pop>=1e3?(pop/1e3).toFixed(0)+'百万':pop.toFixed(0)+'千';
    ctx.fillText(label, PAD.left - 4, py);
  }

  // 軸線
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.5;
  ctx.strokeRect(PAD.left, PAD.top, W, H);

  // 軸タイトル
  ctx.fillStyle = '#475569'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(scaleMode==='japan'?'面積（日本＝1.0）— 対数スケール':'面積 (km²) — 対数スケール',
               PAD.left + W/2, canvas.height - 8);
  ctx.save(); ctx.translate(12, PAD.top + H/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('人口（千人）— 対数スケール', 0, 0); ctx.restore();
}

// Growth rate color scale: red=shrink, yellow=flat, green=grow
function growthColor(rate) {
  // rate is decimal: 0.2 = +20%, -0.1 = -10%
  if (rate >= 0.5)  return '#ef4444'; // >+50% very fast grow (red-orange for extreme)
  if (rate >= 0.3)  return '#f97316'; // +30-50%
  if (rate >= 0.15) return '#f59e0b'; // +15-30%
  if (rate >= 0.05) return '#84cc16'; // +5-15%
  if (rate >= 0.0)  return '#22c55e'; // 0-5%
  if (rate >= -0.05) return '#a3e635'; // -0-5% (slight decline)
  if (rate >= -0.1)  return '#facc15'; // -5-10%
  return '#60a5fa'; // < -10% (strong decline)
}
function growthColorName(rate) {
  if (rate >= 0.5)  return '急増 (>+50%)';
  if (rate >= 0.3)  return '大増 (+30-50%)';
  if (rate >= 0.15) return '増加 (+15-30%)';
  if (rate >= 0.05) return '緩増 (+5-15%)';
  if (rate >= 0.0)  return '微増 (0-5%)';
  if (rate >= -0.05) return '微減 (-0-5%)';
  if (rate >= -0.1)  return '減少 (-5-10%)';
  return '大減 (<-10%)';
}

// 増加率→線の長さ変換（px）
// 100%増加 = 60px、-50%減少 = -60px、ゼロは0px
// 対数スケールで視覚的に自然に
function growthToPx(rate) {
  // rate: decimal (0.3 = +30%)
  // Use signed sqrt scaling: sign * sqrt(|rate|) * scale
  const MAX_PX = 70; // ±100%超でこの長さ
  const scale = MAX_PX / Math.sqrt(1.0);
  return Math.sign(rate) * Math.sqrt(Math.min(Math.abs(rate), 1.5)) * scale;
}

function drawPoints() {
  const search = document.getElementById('search').value.trim();
  const isGrowthMode = scaleMode === 'growth';

  // 全国を表示（地域フィルターのみ適用）
  RAW.forEach(d => {
    if (d.n === '日本') return;
    if (!activeRegions.has(d.r)) return;
    const lx = xVal(d.a);
    const ly = Math.log10(Math.max(d.p, 0.5));
    if (lx < xMin() || lx > xMax() || ly < Y_MIN || ly > Y_MAX) return;
    const [px, py] = toPixel(lx, ly);

    const isMatch = search !== '' && d.n.includes(search);
    const isSelected = selectedCountries.has(d.n);

    const p13 = POP2013[d.n];
    const growthRate = p13 ? (d.p - p13) / p13 : null;
    const pointColor = COLORS[d.r]; // 常に地域カラー

    // 増加率モード：線分を先に描画（点の下に重ねる）
    if (isGrowthMode && growthRate !== null) {
      const linePx = growthToPx(growthRate);
      const lineColor = growthRate >= 0 ? '#3b82f6' : '#ef4444'; // 青=増加、赤=減少
      const lineAlpha = isSelected || isMatch ? 'ff' : 'cc';
      ctx.save();
      ctx.strokeStyle = lineColor + lineAlpha;
      ctx.lineWidth = isSelected ? 2.5 : (isMatch ? 2.5 : 1.8);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px, py - linePx); // 上方向が増加（Y軸は上が大）
      ctx.stroke();
      ctx.restore();
    }

    // 点の描画
    if (isSelected) {
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI*2);
      ctx.fillStyle = pointColor;
      ctx.fill();
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#00000088';
      ctx.shadowBlur = 3;
      const growthLabel = isGrowthMode && growthRate !== null
        ? d.n + ' (' + (growthRate >= 0 ? '+' : '') + (growthRate*100).toFixed(1) + '%)'
        : d.n;
      ctx.fillText(growthLabel, px+10, py);
      ctx.shadowBlur = 0;
    } else if (isMatch) {
      if (blinkOn) {
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI*2);
        ctx.fillStyle = pointColor;
        ctx.fill();
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const growthLabel = isGrowthMode && growthRate !== null
          ? d.n + ' (' + (growthRate >= 0 ? '+' : '') + (growthRate*100).toFixed(1) + '%)'
          : d.n;
        ctx.fillText(growthLabel, px+10, py);
      }
    } else {
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI*2);
      ctx.fillStyle = pointColor + 'bb';
      ctx.fill();
    }
  });
}

function drawJapan() {
  const japan = RAW.find(d=>d.n==='日本');
  if (!japan) return;
  if (!activeRegions.has('アジア')) return;
  const [px, py] = toPixel(xVal(japan.a), Math.log10(japan.p));
  const isSelected = selectedCountries.has('日本');

  // 増加率モード：日本の線を描画（★と区別するためオレンジ色）
  if (scaleMode === 'growth') {
    const p13 = POP2013['日本'];
    if (p13) {
      const growthRate = (japan.p - p13) / p13;
      const linePx = growthToPx(growthRate);
      ctx.save();
      ctx.strokeStyle = '#fb923c'; // オレンジ（赤い★と区別）
      ctx.lineWidth = isSelected ? 2.5 : 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px, py - linePx);
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.font = 'bold 22px serif';
  ctx.fillStyle = '#ff2d55';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ff2d5588'; ctx.shadowBlur = 8;
  ctx.fillText('★', px, py);
  ctx.shadowBlur = 0;
  if (isSelected) {
    const p13 = POP2013['日本'];
    const growthRate = p13 ? (japan.p - p13) / p13 : null;
    const label = (scaleMode === 'growth' && growthRate !== null)
      ? '日本 (' + (growthRate >= 0 ? '+' : '') + (growthRate*100).toFixed(1) + '%)'
      : '日本';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#000000cc'; ctx.shadowBlur = 6;
    ctx.fillText(label, px+14, py);
    ctx.shadowBlur = 0;
  }
}

function drawJapanLine() {
  if (scaleMode !== 'japan') return;
  const [px] = toPixel(0, Y_MIN);
  ctx.save();
  ctx.setLineDash([5,4]);
  ctx.strokeStyle = '#ff2d5577'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(px, PAD.top); ctx.lineTo(px, canvas.height - PAD.bottom); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff2d55aa'; ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('日本', px, PAD.top + 2);
  ctx.restore();
}

function drawJpRegions() {
  activeJpRegions.forEach(name => {
    const reg = JP_REGIONS.find(r=>r.name===name);
    if (!reg) return;
    const lx = xVal(reg.area);
    const ly = Math.log10(Math.max(reg.pop, 0.5));
    const [rx, ry] = toPixel(lx, ly);

    // 縦点線（日本スケール時のみ）
    if (scaleMode === 'japan') {
      ctx.save();
      ctx.setLineDash([4,3]);
      ctx.strokeStyle = '#ff2d5599'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(rx, PAD.top); ctx.lineTo(rx, canvas.height - PAD.bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ff2d55cc'; ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(name, rx, PAD.top + 2);
      ctx.restore();
    }

    // ★マーク
    ctx.font = 'bold 18px serif';
    ctx.fillStyle = '#ff2d55';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff2d5577'; ctx.shadowBlur = 6;
    ctx.fillText('★', rx, ry);
    ctx.shadowBlur = 0;

    // 地域名ラベル
    ctx.font = 'bold 9px sans-serif';
    ctx.fillStyle = '#ff2d55';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(name, rx + 12, ry);
  });
}

function drawInfo() {
  const search = document.getElementById('search').value;
  const cnt = RAW.filter(d => activeRegions.has(d.r)).length;
  let modeLabel;
  if (scaleMode === 'japan') modeLabel = '面積（日本＝1.0）';
  else if (scaleMode === 'growth') modeLabel = '面積 (km²) ｜ 青↑増加 赤↓減少（線の長さ ＝ 増加率、大陸色は維持）';
  else modeLabel = '面積 (km²)';
  document.getElementById('info').textContent =
    '表示中: '+cnt+'カ国　X軸＝'+modeLabel+' — 対数スケール　Y軸＝人口（千人）';
  
  // Show/hide growth legend
  const gl = document.getElementById('growth-legend');
  if (gl) gl.style.display = scaleMode === 'growth' ? 'flex' : 'none';
  // Show/hide regular legend
  const rl = document.getElementById('legend');
  if (rl) rl.style.display = scaleMode === 'growth' ? 'none' : 'flex';
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawAxes();
  drawPoints();
  drawJapanLine();
  drawJpRegions();
  drawJapan();
  drawInfo();
}

// ---- ツールチップ ----
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const tip = document.getElementById('tooltip');

  // 日本地域の★チェック
  if (activeJpRegions.size > 0) {
    let found = null;
    activeJpRegions.forEach(name => {
      const reg = JP_REGIONS.find(r=>r.name===name);
      if (!reg) return;
      const [rx,ry] = toPixel(xVal(reg.area), Math.log10(reg.pop));
      if (Math.hypot(mx-rx, my-ry) < 16) found = reg;
    });
    if (found) {
      const ratio = found.area / JAPAN_AREA;
      const ratioStr = ratio>=1?ratio.toFixed(2)+'倍'
        :(ratio*100>=1)?(ratio*100).toFixed(2)+'%':(ratio*100).toFixed(4)+'%';
      const popStr = found.pop>=1000?(found.pop/1000).toFixed(2)+'百万人':found.pop.toFixed(0)+'千人';
      tip.innerHTML =
        '<div style="font-weight:800;font-size:14px;margin-bottom:4px;">★ '+found.name+'</div>'+
        '<div style="color:#ff2d55;font-size:10px;margin-bottom:8px;">日本の参照地域</div>'+
        '<div>📐 面積: <b>'+found.area.toLocaleString()+' km²</b></div>'+
        '<div style="margin-top:2px;">　　（日本比: <b>'+ratioStr+'</b>）</div>'+
        '<div style="margin-top:4px;">👥 人口: <b>'+popStr+'</b></div>';
      tip.style.display = 'block';
      tip.style.left = (e.clientX+14)+'px';
      tip.style.top  = (e.clientY-10)+'px';
      canvas.style.cursor = 'pointer';
      return;
    }
  }

  // 国データのツールチップ
  const search = document.getElementById('search').value;
  const filtered = RAW.filter(d => activeRegions.has(d.r));
  let closest = null, minDist = 12;
  filtered.forEach(d => {
    const lx = xVal(d.a);
    const ly = Math.log10(Math.max(d.p, 0.5));
    const [px,py] = toPixel(lx, ly);
    const dist = Math.hypot(mx-px, my-py);
    if (dist < minDist) { minDist = dist; closest = d; }
  });

  if (closest) {
    const d = closest;
    const p = d.p>=1000000?(d.p/1000000).toFixed(2)+'億人':d.p>=1000?(d.p/1000).toFixed(2)+'百万人':d.p.toFixed(0)+'千人';
    const ratio = d.a / JAPAN_AREA;
    const aStr = scaleMode==='japan'
      ? '面積: '+(ratio>=1?ratio.toFixed(2)+'倍':(ratio*100>=1)?(ratio*100).toFixed(2)+'%':(ratio*100).toFixed(4)+'%')+
        '（'+d.a.toLocaleString()+' km²）'
      : '面積: '+d.a.toLocaleString()+' km²';
    const p13 = POP2013[d.n];
    const growthStr = p13
      ? (() => {
          const rate = (d.p - p13) / p13 * 100;
          const sign = rate >= 0 ? '+' : '';
          const p13Fmt = p13>=1000000?(p13/1000000).toFixed(2)+'億人':p13>=1000?(p13/1000).toFixed(2)+'百万人':p13.toFixed(0)+'千人';
          return '<div style="margin-top:6px;border-top:1px solid #1e293b;padding-top:6px;">'+
            '📅 <b>2013年:</b> '+p13Fmt+'<br>'+
            '📅 <b>2023年:</b> '+p+'<br>'+
            '<span style="color:'+(rate>=0?'#4ade80':'#f87171')+';">📈 10年増加率: <b>'+sign+rate.toFixed(1)+'%</b></span>'+
            '</div>';
        })()
      : '';
    tip.innerHTML =
      '<div style="font-weight:800;font-size:14px;margin-bottom:4px;">'+d.n+'（'+d.r+'）</div>'+
      '<div>'+aStr+'</div>'+
      (scaleMode !== 'growth' ? '<div style="margin-top:4px;">👥 人口: <b>'+p+'</b></div>' : '') +
      growthStr;
    tip.style.display = 'block';
    tip.style.left = (e.clientX+14)+'px';
    tip.style.top  = (e.clientY-10)+'px';
    canvas.style.cursor = 'crosshair';
  } else {
    tip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('mouseleave', () => {
  document.getElementById('tooltip').style.display = 'none';
});

// クリックで国を選択/解除
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // 日本地域★のクリックは無視
  let jpHit = false;
  activeJpRegions.forEach(name => {
    const reg = JP_REGIONS.find(r=>r.name===name);
    if (!reg) return;
    const [rx,ry] = toPixel(xVal(reg.area), Math.log10(reg.pop));
    if (Math.hypot(mx-rx, my-ry) < 16) jpHit = true;
  });
  if (jpHit) return;

  // 最も近い国を探す
  let closest = null, minDist = 12;
  RAW.forEach(d => {
    if (!activeRegions.has(d.r)) return;
    if (d.n === '日本') return;
    const lx = xVal(d.a);
    const ly = Math.log10(Math.max(d.p, 0.5));
    const [px,py] = toPixel(lx, ly);
    const dist = Math.hypot(mx-px, my-py);
    if (dist < minDist) { minDist = dist; closest = d; }
  });

  // 日本★のクリック判定
  const japan = RAW.find(d=>d.n==='日本');
  if (japan && activeRegions.has('アジア')) {
    const [jx,jy] = toPixel(xVal(japan.a), Math.log10(japan.p));
    if (Math.hypot(mx-jx, my-jy) < 16) {
      if (selectedCountries.has('日本')) selectedCountries.delete('日本');
      else selectedCountries.add('日本');
      draw(); return;
    }
  }

  if (closest) {
    if (selectedCountries.has(closest.n)) selectedCountries.delete(closest.n);
    else selectedCountries.add(closest.n);
    draw();
  }
});

// ---- インフォカード ----
function buildCards() {
  const el = document.getElementById('cards');
  const maxArea  = RAW.reduce((a,b) => a.a>b.a?a:b);
  const maxPop   = RAW.reduce((a,b) => a.p>b.p?a:b);
  const minArea  = RAW.reduce((a,b) => a.a<b.a?a:b);
  const minPop   = RAW.reduce((a,b) => a.p<b.p?a:b);
  const cards = [
    ['🌍','総加盟国数', RAW.length+'カ国'],
    ['📐','最大面積', maxArea.n+' '+maxArea.a.toLocaleString()+' km²'],
    ['👥','最多人口', maxPop.n+' '+(maxPop.p/1000).toFixed(0)+'百万人'],
    ['🔬','最小面積', minArea.n+' '+minArea.a+' km²'],
  ];
  cards.forEach(([icon,title,val]) => {
    const d = document.createElement('div');
    d.style.cssText = 'background:#0d1528;border:1px solid #1e293b;border-radius:8px;padding:4px 12px;text-align:center;min-width:160px;';
    d.innerHTML = '<div style="font-size:14px;">'+icon+'</div>'+
                  '<div style="font-size:9px;color:#475569;">'+title+'</div>'+
                  '<div style="font-size:11px;font-weight:700;color:#e2e8f0;">'+val+'</div>';
    el.appendChild(d);
  });
}

// ---- 増加率一覧表 ----
function toggleGrowthTable() {
  const el = document.getElementById('growth-table-overlay');
  if (el.style.display === 'none' || !el.style.display) {
    buildGrowthTable();
    el.style.display = 'flex';
    document.getElementById('growth-table-btn').style.background = '#f59e0b33';
    document.getElementById('growth-table-btn').style.color = '#f59e0b';
    document.getElementById('growth-table-btn').style.boxShadow = '0 0 0 1.5px #f59e0b';
  } else {
    el.style.display = 'none';
    document.getElementById('growth-table-btn').style.background = '#1e293b';
    document.getElementById('growth-table-btn').style.color = '#64748b';
    document.getElementById('growth-table-btn').style.boxShadow = 'none';
  }
}

function buildGrowthTable() {
  const container = document.getElementById('growth-table-content');
  container.innerHTML = '';
  
  // Sort filter
  const sortEl = document.getElementById('growth-sort');
  const filterEl = document.getElementById('growth-filter');
  const searchEl = document.getElementById('growth-search');
  const sort = sortEl ? sortEl.value : 'desc';
  const filter = filterEl ? filterEl.value : 'all';
  const search = searchEl ? searchEl.value.trim() : '';
  
  let data = RAW.map(d => {
    const p13 = POP2013[d.n] || null;
    const rate = p13 ? (d.p - p13) / p13 * 100 : null;
    return {...d, p13, rate};
  }).filter(d => d.p13 !== null);
  
  if (search) data = data.filter(d => d.n.includes(search));
  
  if (filter === 'increase') data = data.filter(d => d.rate > 0);
  else if (filter === 'decrease') data = data.filter(d => d.rate < 0);
  else if (filter === 'asia') data = data.filter(d => d.r === 'アジア');
  else if (filter === 'europe') data = data.filter(d => d.r === '欧州');
  else if (filter === 'africa') data = data.filter(d => d.r === 'アフリカ');
  else if (filter === 'namerica') data = data.filter(d => d.r === '北米');
  else if (filter === 'samerica') data = data.filter(d => d.r === '南米');
  else if (filter === 'oceania') data = data.filter(d => d.r === 'オセアニア');
  
  data.sort((a,b) => sort === 'desc' ? b.rate - a.rate : a.rate - b.rate);
  
  // Build table
  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-size:11px;';
  const thead = table.createTHead();
  thead.innerHTML = '<tr style="background:#0d1528;position:sticky;top:0;z-index:1;">' +
    '<th style="padding:6px 8px;text-align:left;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">順位</th>' +
    '<th style="padding:6px 8px;text-align:left;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">国名</th>' +
    '<th style="padding:6px 8px;text-align:left;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">地域</th>' +
    '<th style="padding:6px 8px;text-align:right;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">2013年（千人）</th>' +
    '<th style="padding:6px 8px;text-align:right;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">2023年（千人）</th>' +
    '<th style="padding:6px 8px;text-align:right;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">増加数（千人）</th>' +
    '<th style="padding:6px 8px;text-align:right;color:#64748b;font-weight:600;border-bottom:1px solid #1e293b;">増加率</th>' +
    '</tr>';
  
  const tbody = table.createTBody();
  data.forEach((d, i) => {
    const rate = d.rate;
    const sign = rate >= 0 ? '+' : '';
    const rateColor = rate >= 30 ? '#ef4444' : rate >= 15 ? '#f97316' : rate >= 5 ? '#f59e0b'
      : rate >= 0 ? '#22c55e' : rate >= -5 ? '#a3e635' : rate >= -10 ? '#facc15' : '#60a5fa';
    const rateBar = Math.abs(rate) / 80 * 100; // 80% = max bar
    const regionColor = COLORS[d.r] || '#888';
    const tr = document.createElement('tr');
    tr.style.cssText = 'border-bottom:1px solid #0f172a;cursor:pointer;transition:background 0.1s;';
    tr.onmouseover = () => tr.style.background = '#0d1528';
    tr.onmouseout = () => tr.style.background = '';
    const diff = d.p - d.p13;
    const diffSign = diff >= 0 ? '+' : '';
    tr.innerHTML =
      '<td style="padding:5px 8px;color:#475569;">'+(i+1)+'</td>'+
      '<td style="padding:5px 8px;font-weight:700;color:#e2e8f0;">'+d.n+'</td>'+
      '<td style="padding:5px 8px;"><span style="color:'+regionColor+';font-size:10px;">'+d.r+'</span></td>'+
      '<td style="padding:5px 8px;text-align:right;color:#94a3b8;">'+d.p13.toLocaleString()+'</td>'+
      '<td style="padding:5px 8px;text-align:right;color:#e2e8f0;">'+d.p.toLocaleString()+'</td>'+
      '<td style="padding:5px 8px;text-align:right;color:'+(diff>=0?'#4ade80':'#f87171')+';">'+diffSign+diff.toLocaleString()+'</td>'+
      '<td style="padding:5px 8px;text-align:right;">'+
        '<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;">'+
        '<div style="width:60px;height:6px;background:#1e293b;border-radius:3px;overflow:hidden;">'+
          '<div style="width:'+Math.min(rateBar,100)+'%;height:100%;background:'+rateColor+';border-radius:3px;"></div>'+
        '</div>'+
        '<span style="color:'+rateColor+';font-weight:700;min-width:52px;text-align:right;">'+sign+rate.toFixed(1)+'%</span>'+
        '</div>'+
      '</td>';
    tbody.appendChild(tr);
  });
  
  container.appendChild(table);
  
  // Update count
  const countEl = document.getElementById('growth-count');
  if (countEl) countEl.textContent = data.length + 'カ国';
}

// ---- 初期化 ----
buildUI();
resize();
window.addEventListener('resize', resize);
</script>
